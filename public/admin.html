<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Amethia Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/shop.css">
<style>
/* Admin panel: a working back office. Top bar + tabs, dense tables, one side panel for details. */
body{font-size:15px}
.abar{background:var(--bar);color:var(--on-bar)}
.abar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.abar .logo{font-size:24px;color:var(--on-bar)}
.abar .logo small{font-family:var(--f-body);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-left:10px;color:var(--gold-fill)}
.abar nav{display:flex;gap:16px;align-items:center;font-size:13px}
.abar a,.abar button{color:var(--on-bar)}
.abar button{background:none;border:1px solid rgba(255,255,255,.35);padding:6px 12px;cursor:pointer;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:24px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 16px;cursor:pointer;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.panel{padding-block:24px 64px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--line);padding:16px}
.tile .n{font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.filters input{max-width:260px}
.tbl-wrap{background:var(--surface);border:1px solid var(--line)}
.otable tbody tr{cursor:pointer}
.otable tbody tr:hover{background:var(--plate)}
.otable td{white-space:nowrap}
.pill{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;font-weight:500;border:1px solid transparent}
.pill.good{background:#E3F2E6;color:#1E6B34}
.pill.warn{background:#FFF1D6;color:#8A5A00}
.pill.bad{background:#FBE3E1;color:#9A2A20}
.pill.info{background:var(--plate-2);color:var(--ink)}
.pill.mute{border-color:var(--line);color:var(--muted)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pitem{background:var(--surface);border:1px solid var(--line);text-align:left;padding:0;cursor:pointer;display:grid}
.pitem .pimg{aspect-ratio:3/4}
.pitem .pi{padding:12px;display:grid;gap:6px}
.pitem h3{font-family:var(--f-body);font-size:15px;font-weight:400}
.pform{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:start}
.pform > *{min-width:0}
@media (max-width:900px){.pform{grid-template-columns:1fr}}
.colorrow{display:grid;grid-template-columns:1fr 52px auto;gap:8px;align-items:center}
input[type=color]{width:52px;height:44px;border:1px solid var(--line);background:var(--surface);padding:3px}
input[type=number],input[type=email],input[type=password],select.full{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:12px 14px;width:100%}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);padding:8px 12px;cursor:pointer}
.checks input{accent-color:var(--brand)}
.checks .stockin{width:84px;padding:4px 6px;font:inherit;font-size:13px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photo{display:grid;gap:6px}
.photo .pimg{aspect-ratio:3/4}
.photo .row{display:flex;justify-content:space-between;gap:6px}
.small{background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;text-decoration:underline;color:var(--muted)}
.small.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;font-size:14px;z-index:100}
.login{max-width:380px;margin:12vh auto;padding:32px;background:var(--surface);border:1px solid var(--line);display:grid;gap:16px}
.login h1{font-size:32px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.drawer.wide{width:min(560px,100%)}
.notice{background:var(--plate);border:1px solid var(--line);padding:12px 14px;font-size:14px;margin:0 0 16px}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading…</div></div>

<div class="scrim" id="scrim" hidden data-action="close-panel"></div>
<aside class="drawer wide" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="dr-head"><h2 id="ptitle">Order</h2><button class="iconbtn" data-action="close-panel" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dr-body" id="pbody"></div>
</aside>
<div class="toast" id="toast" hidden role="status"></div>

<script src="/garments.js"></script>
<script src="/admin.js"></script>
</body>
</html>
